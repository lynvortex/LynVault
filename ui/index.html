<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LynVault 2.4.0</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="app-shell">
        <header id="titlebar" data-tauri-drag-region>
            <div class="app-brand" data-tauri-drag-region><span class="brand-mark">L</span><span>LynVault</span></div>
            <div class="window-controls">
                <button id="btn-minimize" class="window-control" title="最小化" aria-label="最小化">−</button>
                <button id="btn-maximize" class="window-control" title="最大化" aria-label="最大化">□</button>
                <button id="btn-window-close" class="window-control window-close" title="关闭" aria-label="关闭">×</button>
            </div>
        </header>
        <div id="toolbar">
        <button id="btn-create">新建保险柜</button>
        <button id="btn-open">打开保险柜</button>
        <button id="btn-close" disabled>关闭保险柜</button>
        <span class="sep"></span>
        <button id="btn-add-part" disabled>添加伪装分区</button>
        <button id="btn-del-part" disabled>删除伪装分区</button>
        <span class="sep"></span>
        <button id="btn-import-file" disabled>导入文件</button>
        <button id="btn-import-folder" disabled>导入文件夹</button>
        <button id="btn-extract-all" disabled>提取全部</button>
        <span class="sep"></span>
        <button id="btn-defrag" disabled>整理保险柜</button>
        <button id="btn-destroy" class="danger" disabled>销毁保险箱</button>
    </div>

    <div id="nav" class="hidden">
        <button id="btn-up" title="向上">↑</button>
        <input type="text" id="path-input" value="/">
    </div>

    <div id="file-list"></div>

    <div id="status-bar">©绘萤者 开源地址：https://github.com/lynvortex/LynVault</div>

    <!-- 模态框 -->
    <div id="overlay" class="hidden"></div>
    <div id="dialog" class="hidden">
        <div class="dialog-resize dialog-resize-n" data-dir="n"></div>
        <div class="dialog-resize dialog-resize-s" data-dir="s"></div>
        <div class="dialog-resize dialog-resize-w" data-dir="w"></div>
        <div class="dialog-resize dialog-resize-e" data-dir="e"></div>
        <div class="dialog-resize dialog-resize-nw" data-dir="nw"></div>
        <div class="dialog-resize dialog-resize-ne" data-dir="ne"></div>
        <div class="dialog-resize dialog-resize-sw" data-dir="sw"></div>
        <div class="dialog-resize dialog-resize-se" data-dir="se"></div>
        <div id="dialog-title"></div>
        <div id="dialog-body"></div>
        <div id="dialog-buttons"></div>
    </div>

    <!-- 启动检测弹窗（不可关闭，背景变灰） -->
    <div id="startup-dialog" class="hidden">
        <div class="sd-title">🔐 检测到附近的保险柜</div>
        <div class="sd-body" id="startup-list"></div>
        <div class="sd-buttons">
            <button id="sd-create">新建保险柜</button>
            <button id="sd-open-other">打开其他保险柜</button>
        </div>
    </div>

    <!-- 右键菜单（内容由 app.js 按上下文动态构建：文件/文件夹 或 空白区） -->
    <div id="ctx-menu" class="hidden"></div>

        <script src="app.js"></script>
    </main>
</body>
</html>
