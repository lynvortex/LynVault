[workspace]
resolver = "2"

members = [
    "crates/vault-core",
    "src-tauri",
]

# wry uses the crates.io release required by Tauri 1.
# The former local vendor/wry patch was not included in this repository.

# 2.8.2：发布构建优化 —— 2.8.1 时 workspace 无 [profile.release]，二进制 9.9MB
# 且未做任何链接期优化。thin LTO 跨 crate 内联（vault-core 热路径收益明显），
# strip 移除符号表（抗取证：减少二进制内可被静态分析的结构信息）。
[profile.release]
lto = "thin"
strip = true
codegen-units = 1
# 3.0.0（R1 审计加固）：release 下整数溢出 panic 而非静默回绕 —— 安全产品中
# 回绕的代价远高于检查开销；代码已有大量 checked/saturating，此为兜底保险
overflow-checks = true
