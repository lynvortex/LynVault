[package]
name = "LynVault"
version = "3.1.0"
edition = "2021"
# cargo-deny licenses 门禁要求 manifest 显式声明（与仓库根 LICENSE 一致）
license = "MIT"

# 2.7.1：包名 lynvault-rs → LynVault —— 裸 `cargo build --release` 直接产出
# target/release/LynVault.exe（此前为 lynvault-rs.exe，只有走 bundler 才会被
# 重命名）。

# 3.0.0：Tauri 1.x → 2.x 迁移。
# 权限模型变更：v1 的 allowlist feature 门控全部移除，改由
# capabilities/default.json 声明（core / dialog / opener 三组权限集）。
# 对话框与外部链接打开改走官方插件（v1 是内置 API）：
# - tauri-plugin-dialog —— 文件/目录选择、消息框（后端 blocking API）
# - tauri-plugin-opener —— 系统默认浏览器打开 GitHub 链接（替代 shell-open）

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vault-core = { path = "../crates/vault-core" }
zeroize = "1"
base64 = "0.22"
# 3.1.0：预览用图片解码在既有 png 之上补齐常见格式（主界面与备用 GUI 共用）
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
    "tiff",
] }
log = { version = "0.4", features = ["std"] }
# 3.0.0：可选硬件密钥二因子 —— PC/SC 封装（Windows winscard / Linux pcsc-lite），
# YubiKey HMAC-SHA1 挑战-响应直连（见 src/yubikey.rs 的协议注释）
pcsc = "2"
# 2.8.2（L2/H2）：单实例令牌与对话框令牌的随机生成（OsRng）
rand = "0.8"
# 3.2.0：LYCFG 配置容器 —— HMAC-SHA256 防篡改标签（DPAPI 模式在 Windows 走系统 API）
hmac = "0.12"
sha2 = "0.10"
# 3.1.0：备用 GUI（egui 直染，不依赖 WebView）—— 主窗口创建失败时的完整前端。
# 与 Tauri 并存于同一进程但互不依赖；egui 显式声明以便 gui 模块直接使用
eframe = "0.29"
egui = "0.29"
rfd = "0.15"

# Windows 专属依赖：系统图标读取 + .lyt 文件关联自注册（本应用仅面向 Windows 发布）
# 2.8.0 新增 feature：
# - Win32_System_DataExchange / Win32_System_Com —— 剪贴板保护（监听 + 即时清空）
# - ApplicationModel_DataTransfer / Foundation —— WinRT Clipboard::ClearHistory（清 Win+V 历史）
# - Win32_System_Power / Win32_System_RemoteDesktop —— 睡眠 / 锁屏 / 注销事件监听
# 说明：本 crate 的 windows 0.57 与 Tauri 2 内部的 windows 版本并行共存
#（cargo 允许 semver 不兼容多版本），HWND/HANDLE 跨版本转换在 main.rs 显式处理
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    # 3.2.0：LYCFG 容器 DPAPI 模式（CryptProtectData / CryptUnprotectData）
    "Win32_Security_Cryptography",
    "ApplicationModel_DataTransfer",
    "Foundation",
] }
winreg = "0.52"

# 3.0.0（L-9）：配置临时文件的 O_NOFOLLOW 加固打开（Unix 侧）
[target.'cfg(unix)'.dependencies]
libc = "0.2"


[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
