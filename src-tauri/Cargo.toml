[package]
name = "LynVault"
version = "2.7.1"
edition = "2021"

# 2.7.1：包名 lynvault-rs → LynVault —— 裸 `cargo build --release` 直接产出
# target/release/LynVault.exe（此前为 lynvault-rs.exe，只有走 bundler 才会被
# 重命名）。tauri-cli v1 的 app_binary_path() 按包名定位二进制，包名与产物名
# 一致后该链路不受影响（bundler 的 rename_app 变为同名 no-op）。

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [
    "dialog", "dialog-all",
    "shell-open",
    "window-center",
    "window-close",
    "window-maximize",
    "window-minimize",
    "window-start-dragging",
    "window-unmaximize",
    "window-set-resizable",
    "window-set-size",
    "window-set-title",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vault-core = { path = "../crates/vault-core" }
zeroize = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
log = { version = "0.4", features = ["std"] }

# Windows 专属依赖：系统图标读取 + .lyt 文件关联自注册（本应用仅面向 Windows 发布）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
winreg = "0.52"


[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
