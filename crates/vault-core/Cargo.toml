[package]
name = "vault-core"
version = "2.8.0"
edition = "2021"

[dependencies]
hex = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
# 2.4.1 新增：DoD 擦除的 Random pass 改用 ChaCha20 流式生成（P1-8）
rand_chacha = "0.3"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
byteorder = "1"
log = "0.4"
# 2.6.1 安全升级：calamine 0.24 → 0.36（其内部依赖 quick-xml ^0.41），
# 消除 RUSTSEC-2026-0194/0195（quick-xml 0.31 高危：重复属性名二次方耗时、
# NsReader 命名空间声明无界分配导致内存耗尽 DoS）。
calamine = "0.36"
quick-xml = "0.41"
# 2.7.1：zip 0.6 → 8。0.6 主线已停止维护（依赖树中曾与 8.x 双份并存）；
# 本仓库仅用内存内 by_name 读取（无 Zip-Slip 面）与测试内 ZipWriter，API 兼容
zip = "8"
cfb = "0.7"
libc = "0.2"
# 2.7.0：加密 Office 预览(Agile Encryption 解密)
# aes 已在依赖树中(aes-gcm 0.10 的底层),base64 同理;sha1 为新增小依赖
aes = "0.8"
base64 = "0.22"
sha1 = "0.10"

# 2.5.1 新增：销毁路径 delete-on-close（TOCTOU 修复，见 wipe.rs）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }