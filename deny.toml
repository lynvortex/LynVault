# cargo-deny 配置 —— CI 的第 4 道门禁（依赖漏洞 + 许可证 + 来源）
# 文档：https://embarkstudios.github.io/cargo-deny/

# ── 依赖安全公告（RustSEC）─────────────────────────────────────────────
# yanked 的 crate 直接拒绝（lockfile 里出现已被撤回的版本说明依赖树有问题）。
# 漏洞（vulnerability）类公告在所有版本中默认即为 deny，无需重复配置。
# 如某条公告经评估不适用（如漏洞仅在未启用的 feature 中），在此列出并注明原因：
[advisories]
yanked = "deny"
ignore = [
  # proc-macro-error 失维护（RUSTSEC-2024-0370）：无可用升级，仅经
  # glib-macros → gtk 传入（Tauri 2 的 Linux/GTK 构建专属依赖链），
  # Windows 发布产物不受影响；待 gtk-rs/tauri 上游换用替代宏库后移除。
  { id = "RUSTSEC-2024-0370", reason = "仅 Linux GTK 链路传入，无可用升级，上游跟进中" },
  # glib 0.18.5 unsound（RUSTSEC-2024-0429）：3.0.1（#41）补记录 —— 无可用
  # 升级（0.18 系列无修复版），仅经 Tauri 2 的 Linux/GTK 链路传入（glib →
  # gtk），Windows 发布产物不受影响；soundness 缺陷在本项目的使用面
  #（信号/对象包装）未触及。跟踪 gtk-rs 上游升级后移除。
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 无修复版，仅 Linux GTK 链路，使用面未触及缺陷" },
]

# ── 许可证合规 ────────────────────────────────────────────────────────
# 本项目为 MIT。依赖树中允许出现的宽松许可证白名单：
# 出现不在白名单内的许可证时 CI 报错，届时人工评估后决定加入或更换依赖。
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # libbz2-rs-sys（zip → bzip2，calamine 预览链路）自带 bzip2 源码许可证，
  # BSD 风格宽松许可（保留版权声明即可自由使用）
  "bzip2-1.0.6",
]

# ── 重复依赖版本 ──────────────────────────────────────────────────────
# 同一 crate 多版本并存只警告（依赖树常见且多数无害），不阻断。
# 3.0.1（#45 更正）：本档事实上的「warn」与 ci.yml 曾宣称的「bans 已配置
# multiple-versions 策略且执行」存在口径差 —— 如实记录当前策略：warn 级
# 不阻断构建；后续逐步把安全敏感的重复依赖（crypto/zip 链路）单独升为
# deny 是目标方向，尚未实施。
[bans]
multiple-versions = "warn"

# ── 来源校验 ──────────────────────────────────────────────────────────
# 只允许 crates.io 与官方 registry，禁止 git 直引等不可审计来源。
# 键名以 cargo-deny 当前 schema 为准（unknown-source 已不存在，git 来源
# 对应 unknown-git）：
[sources]
unknown-registry = "deny"
unknown-git = "deny"
